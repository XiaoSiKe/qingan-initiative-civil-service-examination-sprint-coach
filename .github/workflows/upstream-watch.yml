name: Upstream watch

on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compare pinned upstreams
        id: upstreams
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python plugins/qingan/scripts/check_upstreams.py --fail-on-change > upstream-report.json
          result=$?
          cat upstream-report.json
          if [ "$result" -eq 3 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$result"
      - name: Create or update maintenance issue
        if: steps.upstreams.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="上游 Skill 有更新待审查"
          body="$(jq -r '"发现以下固定上游发生变化。不要自动复制内容；请逐项检查许可证、差异和行为测试。\n\n```json\n" + (tojson) + "\n```"' upstream-report.json)"
          issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
